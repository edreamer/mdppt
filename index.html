<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD簡報生成器</title>
    
    <!-- Reveal.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/black.min.css" id="theme">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- 核心視覺系統 --- */
        :root {
            /* 預設: Cyberpunk */
            --bg-gradient: linear-gradient(135deg, #0b1021, #1b2742, #101525);
            --text-primary: #f0f2f5;
            --accent-color: #00d2ff;     /* 主要亮色 */
            --secondary-color: #00ff9d;  /* 次要亮色 */
            --ui-glass: rgba(16, 21, 37, 0.95);
            --tool-bg: rgba(255, 255, 255, 0.1);
            --tool-hover: #448aff;
        }

        body { margin: 0; overflow: hidden; background: #0b1021; }

        /* Reveal.js 樣式覆蓋 */
        .reveal { background: var(--bg-gradient); color: var(--text-primary); transition: background 0.8s ease; }
        
        /* 1. 字體與標題設定 */
        .reveal h1, .reveal h2, .reveal h3, .reveal h4 {
            font-family: "Microsoft YaHei", "Heiti TC", sans-serif;
            font-weight: 700; text-transform: none; letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        /* H1 改為純色，移除漸層 */
        .reveal h1 { 
            color: var(--accent-color);
            margin-bottom: 0.5em;
        }
        
        .reveal h2 { 
            color: var(--accent-color) !important;
            border-bottom: 3px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
            margin-bottom: 30px !important;
        }

        .reveal h3 { 
            color: var(--secondary-color) !important;
            font-weight: 500;
            opacity: 0.9;
        }

        .reveal p, .reveal li { 
            font-family: "Microsoft JhengHei", sans-serif; 
            line-height: 1.6; 
            font-size: 1.1em;
            color: rgba(255,255,255,0.9); 
        }

        /* Reveal.js 內建導航箭頭優化 */
        .reveal .controls {
            color: var(--accent-color) !important;
        }
        .reveal .controls button {
            opacity: 0.5 !important;
        }
        .reveal .controls button.enabled {
            opacity: 1 !important;
        }
        
        /* --- 2. 新版右上角工具列 --- */
        .smart-toolbar {
            position: fixed;
            top: 20px;   /* 右上角 */
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 5px;
            padding: 5px 0;
            width: 44px;
            height: 44px; /* 初始高度 */
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Hover 展開 */
        .smart-toolbar:hover {
            height: 220px; /* 增加高度以容納下載按鈕 */
            background: rgba(10, 15, 30, 0.8);
            border-color: rgba(255,255,255,0.3);
        }

        /* 全螢幕時隱藏 */
        .hide-toolbar {
            display: none !important;
        }

        .tool-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .tool-btn:hover {
            background: var(--tool-hover);
            color: #fff;
            transform: scale(1.1);
        }
        
        /* 頂部選單圖示 */
        .menu-icon {
            color: var(--accent-color);
            font-size: 18px;
            margin-bottom: 2px;
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 34px;
            flex-shrink: 0;
        }

        /* 工具提示 (Tooltip) */
        .tool-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            right: 50px; 
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .smart-toolbar:hover .tool-btn:hover::after {
            opacity: 1;
        }

        /* 幫助訊息 Toast */
        .help-toast {
            position: fixed; top: 80px; right: 20px;
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--accent-color);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 250px;
            z-index: 1900;
            opacity: 0; pointer-events: none; transform: translateX(20px);
            transition: all 0.3s;
        }
        .help-toast.show { opacity: 1; pointer-events: auto; transform: translateX(0); }

        /* 編輯器 Modal */
        .glass-modal {
            background: var(--ui-glass);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        textarea {
            background-color: rgba(0,0,0,0.3) !important;
            color: #e0e0e0 !important;
            font-family: 'Consolas', monospace;
            border: 1px solid rgba(255,255,255,0.1);
        }
        textarea:focus { border-color: var(--accent-color); }

        /* 主題選擇器網格 */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 5px;
        }
        .theme-option {
            width: 100%; aspect-ratio: 1;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
            position: relative;
        }
        .theme-option:hover { transform: scale(1.1); }
        .theme-option.active { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
    </style>
</head>
<body>

    <!-- Reveal.js 容器 -->
    <div class="reveal">
        <div class="slides" id="slides-container">
            <!-- 內容動態生成 -->
        </div>
    </div>

    <!-- 2. 全新右上角工具列 (Smart Toolbar) -->
    <div class="smart-toolbar" id="toolbar">
        <!-- 選單圖示 -->
        <div class="menu-icon">
            <i class="fa-solid fa-bars"></i>
        </div>
        
        <!-- 展開後的按鈕 -->
        <!-- 下載 (New) -->
        <button class="tool-btn" onclick="downloadHTML()" data-tooltip="下載 html">
            <i class="fa-solid fa-download"></i>
        </button>

        <!-- 編輯 -->
        <button class="tool-btn" onclick="toggleModal()" data-tooltip="編輯簡報">
            <i class="fa-solid fa-pen-to-square"></i>
        </button>
        
        <!-- 全螢幕 -->
        <button class="tool-btn" onclick="toggleFullScreen()" data-tooltip="全螢幕">
            <i class="fa-solid fa-expand"></i>
        </button>

        <!-- 說明 -->
        <button class="tool-btn" onclick="toggleHelp()" data-tooltip="說明">
            <i class="fa-solid fa-question"></i>
        </button>
    </div>

    <!-- 幫助訊息 -->
    <div id="help-toast" class="help-toast">
        <h4 class="text-cyan-400 font-bold mb-2">導航指引</h4>
        <ul class="list-disc pl-4 space-y-1 text-gray-300">
            <li><strong>左右鍵</strong>：切換章節</li>
            <li><strong>上下鍵</strong>：查看細節</li>
            <li><strong>F 鍵</strong>：全螢幕</li>
            <li><strong>ESC</strong>：總覽模式</li>
        </ul>
    </div>

    <!-- 編輯器 Modal -->
    <div id="editor-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(2px);">
        <div class="glass-modal w-full max-w-5xl rounded-xl p-6 flex flex-col h-[90vh] shadow-2xl animate-fade-in-up">
            
            <!-- Header -->
            <div class="flex justify-between items-start mb-4 border-b border-gray-700 pb-3">
                <div>
                    <h2 class="text-2xl font-bold text-white mb-1"><i class="fa-brands fa-markdown mr-2"></i>MD簡報生成器</h2>
                    <p class="text-xs text-gray-400">貼上 Markdown 或上傳檔案，即時生成簡報。</p>
                </div>
                <button onclick="toggleModal()" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-times text-2xl"></i></button>
            </div>

            <div class="flex gap-6 flex-1 overflow-hidden">
                <!-- 左側：編輯區 -->
                <div class="flex-1 flex flex-col">
                    <!-- Toolbar -->
                    <div class="flex justify-between mb-2">
                        <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 px-3 py-1 rounded transition">
                            <i class="fa-solid fa-upload mr-1"></i> 讀取檔案
                            <input type="file" class="hidden" onchange="handleFileUpload(this)">
                        </label>
                        <button onclick="loadDefaultMarkdown()" class="text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-rotate-left"></i> 載入範本</button>
                    </div>
                    
                    <textarea id="md-input" class="flex-1 w-full rounded-lg p-4 resize-none text-sm leading-relaxed focus:outline-none" placeholder="在此輸入 Markdown..."></textarea>
                </div>

                <!-- 右側：設定區 -->
                <div class="w-64 flex flex-col gap-6 border-l border-gray-700 pl-6">
                    
                    <!-- 配色方案 -->
                    <div>
                        <h3 class="text-sm font-bold text-gray-300 mb-3 uppercase tracking-wider">配色風格</h3>
                        <div class="theme-grid" id="theme-container">
                            <!-- JS 動態生成 -->
                        </div>
                    </div>

                    <!-- 生成按鈕 -->
                    <div class="mt-auto">
                        <button onclick="generateSlides()" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white py-3 rounded-lg font-bold shadow-lg transform active:scale-95 transition">
                            <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>生成簡報
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>
    <script>
        // --- 1. 定義 10 種配色方案 ---
        const themes = [
            { id: 'cyberpunk', name: 'Cyberpunk', bg: 'linear-gradient(135deg, #0b1021, #1b2742)', accent: '#00d2ff', sec: '#00ff9d', color: '#0b1021' },
            { id: 'sunset', name: 'Sunset', bg: 'linear-gradient(135deg, #2d0b15, #421b28)', accent: '#ffab40', sec: '#ff4081', color: '#421b28' },
            { id: 'forest', name: 'Forest', bg: 'linear-gradient(135deg, #051a12, #0d3326)', accent: '#00ff9d', sec: '#aeff00', color: '#051a12' },
            { id: 'ocean', name: 'Deep Ocean', bg: 'linear-gradient(135deg, #001e3c, #003366)', accent: '#00b4d8', sec: '#90e0ef', color: '#003366' },
            { id: 'obsidian', name: 'Obsidian', bg: 'linear-gradient(135deg, #000000, #1a1a1a)', accent: '#ffffff', sec: '#808080', color: '#1a1a1a' },
            { id: 'royal', name: 'Royal', bg: 'linear-gradient(135deg, #1a0b2e, #2d1b4e)', accent: '#ffd700', sec: '#d4af37', color: '#2d1b4e' },
            { id: 'matrix', name: 'Matrix', bg: 'linear-gradient(135deg, #000000, #0a140a)', accent: '#00ff00', sec: '#008f11', color: '#000000' },
            { id: 'lavender', name: 'Lavender', bg: 'linear-gradient(135deg, #1e1e2e, #2a2a40)', accent: '#cba6f7', sec: '#f5c2e7', color: '#2a2a40' },
            { id: 'coffee', name: 'Espresso', bg: 'linear-gradient(135deg, #2b1b17, #3e2723)', accent: '#d7ccc8', sec: '#a1887f', color: '#3e2723' },
            { id: 'crimson', name: 'Crimson', bg: 'linear-gradient(135deg, #2b0505, #4a0404)', accent: '#ff5252', sec: '#ff8a80', color: '#4a0404' }
        ];

        // 預設 Markdown
        const defaultMarkdown = `
# MD簡報生成器
### 快速生成 • 鍵盤導航 • 即時預覽

---

## 1. 介面更新說明
* **下載功能**：右上角新增下載按鈕，可將簡報存為 HTML
* **簡約模式**：下載後的檔案只保留全螢幕按鈕
* **MD簡報生成器**：品牌名稱已全面更新

### 1.1 垂直細節頁
* 這是垂直向下的頁面
* 按下 **↓ (下)** 鍵查看
* 適合放置技術細節或圖表

---

## 2. 操作說明
* 點擊右上角 **<i class="fa-solid fa-pen-to-square"></i>** 編輯內容
* 點擊右上角 **<i class="fa-solid fa-download"></i>** 下載成單一檔案
* 點擊右上角 **<i class="fa-solid fa-expand"></i>** 進入全螢幕

### 2.1 程式碼範例
\`\`\`javascript
// 下載功能核心邏輯
function downloadHTML() {
  const content = document.getElementById('md-input').value;
  // 將目前的 Markdown 寫入到輸出的 HTML 中
  // 並移除多餘的編輯按鈕...
}
\`\`\`
        `.trim();

        let deck = null;

        // 初始化
        window.addEventListener('load', () => {
            renderThemeSelector();
            document.getElementById('md-input').value = defaultMarkdown; 
            
            // 監聽全螢幕變化，隱藏工具列
            document.addEventListener("fullscreenchange", () => {
                const toolbar = document.getElementById('toolbar');
                if (document.fullscreenElement) {
                    toolbar.classList.add('hide-toolbar');
                } else {
                    toolbar.classList.remove('hide-toolbar');
                }
            });

            generateSlides();
        });

        // 渲染主題選擇器
        function renderThemeSelector() {
            const container = document.getElementById('theme-container');
            let html = '';
            themes.forEach(t => {
                html += `
                    <div onclick="setTheme('${t.id}')" 
                         class="theme-option ${t.id === 'cyberpunk' ? 'active' : ''}" 
                         data-theme="${t.id}"
                         title="${t.name}"
                         style="background: ${t.bg}; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2);">
                         <div style="position:absolute; bottom:0; right:0; width:50%; height:50%; background:${t.accent}; border-radius: 50% 0 50% 0; opacity:0.8;"></div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 設定主題
        function setTheme(themeId) {
            const t = themes.find(x => x.id === themeId);
            if (!t) return;

            const root = document.documentElement;
            root.style.setProperty('--bg-gradient', t.bg);
            root.style.setProperty('--accent-color', t.accent);
            root.style.setProperty('--secondary-color', t.sec);
            root.style.setProperty('--tool-hover', t.accent);

            document.querySelectorAll('.theme-option').forEach(el => {
                el.classList.toggle('active', el.dataset.theme === themeId);
            });
            
            if (deck) deck.sync();
        }

        // Modal 控制
        function toggleModal() {
            const modal = document.getElementById('editor-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('md-input').focus();
            }
        }

        // 全螢幕控制
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn("全螢幕請求被拒絕:", err);
                    alert("瀏覽器或當前環境不支援全螢幕模式。");
                });
            } else if (document.exitFullscreen) {
                document.exitFullscreen().catch(err => {
                    console.warn("退出全螢幕失敗:", err);
                });
            }
        }

        // 說明 Toast
        function toggleHelp() {
            const toast = document.getElementById('help-toast');
            toast.classList.toggle('show');
            setTimeout(() => {
                if(toast.classList.contains('show')) toast.classList.remove('show');
            }, 5000); 
        }

        // 下載功能 (New)
        function downloadHTML() {
            const mdContent = document.getElementById('md-input').value;
            let html = document.documentElement.outerHTML;

            // 1. 更新預設 Markdown 內容，確保下載後開啟能顯示當前編輯的內容
            // 需要跳脫字元避免破壞輸出的 JS 字串
            const safeMd = mdContent
                .replace(/\\/g, '\\\\')
                .replace(/`/g, '\\`')
                .replace(/\${/g, '\\${'); 
            
            // 使用 Regex 替換 const defaultMarkdown 的內容
            html = html.replace(
                /const defaultMarkdown = `[\s\S]*?`.trim\(\);/,
                `const defaultMarkdown = \`${safeMd}\`.trim();`
            );

            // 2. 修改工具列：只保留全螢幕按鈕
            // 我們使用 Regex 直接替換掉整個 toolbar div，比 DOMParser 更能保留原始格式
            const newToolbarHTML = `
    <div class="smart-toolbar" id="toolbar">
        <div class="menu-icon"><i class="fa-solid fa-bars"></i></div>
        <button class="tool-btn" onclick="toggleFullScreen()" data-tooltip="全螢幕">
            <i class="fa-solid fa-expand"></i>
        </button>
    </div>`;
            
            html = html.replace(
                /<div class="smart-toolbar" id="toolbar">[\s\S]*?<\/div>/, 
                newToolbarHTML
            );

            // 3. 觸發下載
            const blob = new Blob(["<!DOCTYPE html>\n" + html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mdppt.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 檔案上傳
        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('md-input').value = e.target.result;
            };
            reader.readAsText(file);
        }

        function loadDefaultMarkdown() {
            document.getElementById('md-input').value = defaultMarkdown;
        }

        // 核心生成邏輯
        async function generateSlides() {
            const rawMarkdown = document.getElementById('md-input').value;
            const tokens = marked.lexer(rawMarkdown);
            
            let htmlChunks = [];
            let currentSlide = [];
            
            tokens.forEach(token => {
                if (token.type === 'hr') {
                    if (currentSlide.length) htmlChunks.push(currentSlide);
                    currentSlide = [];
                } else {
                    currentSlide.push(token);
                }
            });
            if (currentSlide.length) htmlChunks.push(currentSlide);

            let finalHTML = '';

            htmlChunks.forEach(chunk => {
                const hasSubSlides = chunk.some(t => t.type === 'heading' && t.depth === 3);
                
                if (hasSubSlides) {
                    finalHTML += '<section>';
                    let subSlides = [];
                    let currentSub = [];
                    
                    chunk.forEach(token => {
                        if (token.type === 'heading' && token.depth === 3) {
                            if (currentSub.length) subSlides.push(currentSub);
                            currentSub = [token];
                        } else {
                            currentSub.push(token);
                        }
                    });
                    if (currentSub.length) subSlides.push(currentSub);

                    subSlides.forEach(sub => {
                        sub.links = tokens.links;
                        finalHTML += `<section>${marked.parser(sub)}</section>`;
                    });
                    finalHTML += '</section>';
                } else {
                    chunk.links = tokens.links;
                    finalHTML += `<section>${marked.parser(chunk)}</section>`;
                }
            });

            document.getElementById('slides-container').innerHTML = finalHTML;

            if (deck) {
                deck.destroy();
                deck = null;
            }
            deck = new Reveal({
                controls: true,
                progress: true,
                center: true,
                hash: false,
                mouseWheel: true,
                transition: 'convex',
            });
            deck.initialize();

            const modal = document.getElementById('editor-modal');
            if (!modal.classList.contains('hidden')) {
                toggleModal();
            }
        }
    </script>
</body>
</html>
