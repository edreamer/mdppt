<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1021">
  <meta name="description" content="將 Markdown 快速轉換成精美、可下載的 Reveal.js 簡報。">
  <title>MD 簡報產生器</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reset.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/black.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <style>
    :root { --bg: linear-gradient(135deg,#081225,#172747 55%,#101525); --accent:#00d2ff; --secondary:#00ff9d; --panel:rgba(10,17,35,.92); --muted:rgba(240,242,245,.7); }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; background:#081225; color:#f0f2f5; font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif; }
    .reveal { background:var(--bg); color:#f0f2f5; transition:background .5s ease; }
    .reveal .slides { text-align:left; }
    .reveal section { width:100%; padding-inline:4rem; }
    .reveal section.leaf-slide { min-height:100%; display:flex; flex-direction:column; justify-content:center; }
    .reveal h1,.reveal h2,.reveal h3,.reveal h4 { font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif; font-weight:800; text-align:center; text-transform:none; letter-spacing:.02em; text-shadow:0 3px 14px #0005; }
    .reveal h1 { width:100%; max-width:900px; margin-inline:auto; color:var(--accent); font-size:5.5rem; line-height:1.12; }
    .reveal h2 { width:100%; max-width:860px; margin:0 auto .8em; color:var(--accent); border-bottom:1px solid #ffffff26; padding-bottom:.35em; font-size:4rem; line-height:1.18; }
    .reveal h3 { width:100%; max-width:820px; margin-inline:auto; color:var(--secondary); font-size:3rem; line-height:1.25; }
    .reveal p,.reveal li { color:var(--muted); line-height:1.8; text-align:left; }
    .reveal section > p,.reveal section > ul,.reveal section > ol,.reveal section > blockquote,.reveal section > pre { max-width:1000px; margin-right:auto; margin-left:auto; }
    .reveal section.compact { font-size:.86em; }
    .reveal section.compact h1 { font-size:4.5rem; }
    .reveal section.compact h2 { font-size:3.3rem; }
    .reveal section.compact h3 { font-size:2.5rem; }
    .reveal section.dense { font-size:.74em; }
    .reveal section.dense h1 { font-size:3.8rem; }
    .reveal section.dense h2 { font-size:2.8rem; }
    .reveal section.dense h3 { font-size:2.1rem; }
    .reveal section.content-overflow::after { content:'內容過長，建議使用 --- 拆頁'; position:absolute; right:5rem; bottom:-2rem; padding:.35rem .65rem; border:1px solid #ffb74d88; border-radius:.4rem; color:#ffcc80; background:#1b1208dd; font-size:.7rem; line-height:1.2; }
    .continuation-label { margin:0 auto .4em; color:var(--secondary); font-size:.8em; text-align:center!important; opacity:.8; }
    .continuation-marker { display:inline-block; margin-left:.45em; color:var(--secondary); font-size:.42em; font-weight:600; letter-spacing:0; opacity:.72; vertical-align:middle; }
    .reveal code { color:#ffe082; background:#0005; border-radius:5px; padding:.1em .3em; }
    .reveal pre { width:100%; box-shadow:0 12px 35px #0004; }
    .reveal .controls { color:var(--accent); }
    .reveal .progress { height:4px; color:var(--accent); }
    .smart-toolbar { position:fixed; top:auto; right:auto; bottom:18px; left:18px; z-index:20; display:flex; align-items:center; gap:4px; padding:5px; min-height:48px; border:1px solid #ffffff24; border-radius:16px; background:#0b1226cc; backdrop-filter:blur(14px); box-shadow:0 12px 30px #0003; }
    .tool-btn { position:relative; width:38px; height:38px; border:0; border-radius:11px; background:transparent; color:#ffffffb8; cursor:pointer; transition:.2s ease; }
    .tool-btn:hover,.tool-btn:focus-visible { color:#fff; background:var(--accent); transform:translateY(-2px); outline:none; }
    .tool-btn::after { content:attr(aria-label); position:absolute; top:calc(100% + 8px); right:0; padding:5px 8px; border-radius:6px; background:#050914; color:#fff; font-size:12px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .2s; }
    .tool-btn:hover::after,.tool-btn:focus-visible::after { opacity:1; }
    .brand-mark { display:grid; place-items:center; width:38px; height:38px; color:var(--accent); font-size:18px; }
    .help-toast { position:fixed; top:78px; right:18px; z-index:19; width:min(300px,calc(100vw - 36px)); padding:16px 18px; border:1px solid var(--accent); border-radius:12px; background:#050914ee; box-shadow:0 14px 35px #0005; transform:translateY(-8px); opacity:0; pointer-events:none; transition:.25s ease; }
    .help-toast.show { transform:none; opacity:1; pointer-events:auto; }
    .help-toast h2 { margin:0 0 8px; color:var(--accent); font-size:16px; }
    .help-toast ul { margin:0; padding-left:20px; color:#ffffffc7; font-size:13px; line-height:1.8; }
    .modal-backdrop { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:20px; background:#0008; backdrop-filter:blur(8px); }
    .modal-backdrop[hidden] { display:none; }
    .editor-modal { display:flex; flex-direction:column; width:min(1100px,100%); height:min(760px,90vh); padding:24px; border:1px solid #ffffff1a; border-radius:20px; background:var(--panel); box-shadow:0 24px 80px #0008; }
    .modal-header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; padding-bottom:16px; border-bottom:1px solid #ffffff18; }
    .modal-header h2 { margin:0 0 4px; font-size:22px; color:#fff; }
    .modal-header p { margin:0; color:#ffffff80; font-size:13px; }
    .icon-button { border:0; background:none; color:#ffffff99; cursor:pointer; font-size:22px; }
    .editor-layout { display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:24px; min-height:0; flex:1; padding-top:20px; }
    .editor-pane,.settings-pane { display:flex; flex-direction:column; min-height:0; }
    .editor-actions { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .file-button,.reset-button { border:0; border-radius:8px; padding:8px 11px; color:#ffffffc7; background:#ffffff12; cursor:pointer; font-size:12px; }
    .file-button:hover,.reset-button:hover { background:#ffffff22; color:#fff; }
    textarea { width:100%; flex:1; min-height:180px; resize:none; padding:16px; border:1px solid #ffffff18; border-radius:12px; background:#0006; color:#e9eef7; font:14px/1.7 Consolas,monospace; outline:none; }
    textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent),transparent 80%); }
    .settings-pane { padding-left:20px; border-left:1px solid #ffffff18; }
    .settings-pane h3 { margin:0 0 14px; color:#ffffffb8; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .transition-setting,.background-setting { margin-top:24px; }
    .transition-setting label,.background-setting label { display:block; margin-bottom:8px; color:#ffffffb8; font-size:12px; letter-spacing:.08em; }
    .transition-select { width:100%; padding:10px 12px; border:1px solid #ffffff1c; border-radius:8px; color:#fff; background:#121b32; font:inherit; cursor:pointer; outline:none; }
    .transition-select:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent),transparent 80%); }
    .background-input { width:100%; padding:10px 12px; border:1px solid #ffffff1c; border-radius:8px; color:#fff; background:#121b32; font-size:12px; line-height:1.4; font-family:inherit; outline:none; }
    .background-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent),transparent 80%); }
    .theme-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
    .theme-option { aspect-ratio:1; border:2px solid transparent; border-radius:50%; cursor:pointer; transition:.2s; }
    .theme-option:hover,.theme-option.active { transform:scale(1.1); border-color:#fff; box-shadow:0 0 14px #fff8; }
    .generate-button { margin-top:auto; padding:13px; border:0; border-radius:10px; color:#fff; background:linear-gradient(110deg,#2563eb,var(--accent)); cursor:pointer; font-weight:700; box-shadow:0 8px 20px #00d2ff33; }
    .generate-button:hover { filter:brightness(1.12); transform:translateY(-1px); }
    @media (max-width:700px) {
      .reveal section { padding-inline:1.25rem; }
      .reveal section.leaf-slide { padding-top:1rem; padding-bottom:6rem; }
      .reveal { font-size:18px; }
      .reveal h1 { font-size:2.6rem; }
      .reveal h2 { font-size:2rem; }
      .reveal h3 { font-size:1.55rem; }
      .reveal p,.reveal li { font-size:1.12rem; line-height:1.5; }
      .reveal section.content-overflow::after { right:1.25rem; bottom:5.5rem; }
      .smart-toolbar { top:auto; right:auto; bottom:12px; left:12px; justify-content:flex-start; border-radius:14px; }
      .brand-mark { display:none; }
      .tool-btn { width:44px; height:42px; }
      .tool-btn::after { top:auto; bottom:calc(100% + 8px); }
      .editor-modal { height:94vh; padding:16px; }
      .editor-layout { grid-template-columns:1fr; gap:14px; overflow:auto; }
      .settings-pane { padding:14px 0 0; border:0; border-top:1px solid #ffffff18; }
      .generate-button { margin-top:20px; }
      .theme-grid { grid-template-columns:repeat(10,1fr); }
      .reveal .controls { bottom:6.5rem; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }
  </style>
</head>
<body>
  <main class="reveal" aria-label="Markdown 簡報預覽"><div class="slides" id="slides-container"></div></main>
  <nav class="smart-toolbar" id="toolbar" aria-label="簡報工具列">
    <div class="brand-mark" aria-hidden="true"><i class="fa-brands fa-markdown"></i></div>
    <button class="tool-btn" type="button" onclick="downloadHTML()" aria-label="下載 HTML"><i class="fa-solid fa-download"></i></button>
    <button class="tool-btn" type="button" onclick="toggleModal()" aria-label="編輯 Markdown"><i class="fa-solid fa-pen-to-square"></i></button>
    <button class="tool-btn" type="button" onclick="toggleFullScreen()" aria-label="全螢幕"><i class="fa-solid fa-expand"></i></button>
    <button class="tool-btn" type="button" onclick="toggleHelp()" aria-label="使用說明"><i class="fa-solid fa-question"></i></button>
  </nav>
  <aside id="help-toast" class="help-toast" aria-live="polite">
    <h2>快速操作</h2>
    <ul><li>方向鍵／滑鼠滾輪：切換投影片</li><li>F：進入全螢幕</li><li>Esc：離開全螢幕或關閉視窗</li><li>Markdown 以 --- 分隔投影片</li></ul>
  </aside>
  <div id="editor-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="editor-title" hidden>
    <section class="editor-modal">
      <header class="modal-header"><div><h2 id="editor-title"><i class="fa-brands fa-markdown"></i> Markdown 簡報編輯器</h2><p>編輯內容、選擇主題，完成後即時產生簡報。</p></div><button class="icon-button" type="button" onclick="toggleModal()" aria-label="關閉編輯器"><i class="fa-solid fa-xmark"></i></button></header>
      <div class="editor-layout">
        <div class="editor-pane"><div class="editor-actions"><label class="file-button"><i class="fa-solid fa-upload"></i> 匯入 .md<input id="file-input" type="file" accept=".md,.markdown,text/markdown" hidden onchange="handleFileUpload(this)"></label><button class="reset-button" type="button" onclick="loadDefaultMarkdown()"><i class="fa-solid fa-rotate-left"></i> 還原範例</button></div><textarea id="md-input" spellcheck="false" aria-label="Markdown 內容"></textarea></div>
        <aside class="settings-pane"><h3>選擇主題</h3><div class="theme-grid" id="theme-container"></div><div class="transition-setting"><label for="transition-select">翻頁特效</label><select id="transition-select" class="transition-select" aria-label="翻頁特效"><option value="none">無特效</option><option value="fade">淡入淡出</option><option value="slide">滑動</option><option value="convex">凸面</option><option value="concave">凹面</option><option value="zoom">縮放</option></select></div><div class="background-setting"><label for="background-url">背景圖片網址</label><input id="background-url" class="background-input" type="url" inputmode="url" placeholder="https://..." aria-label="背景圖片網址"></div><button class="generate-button" type="button" onclick="generateSlides()"><i class="fa-solid fa-wand-magic-sparkles"></i> 產生簡報</button></aside>
      </div>
    </section>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>
  <script>
    const themes = [
      {id:'cyberpunk',name:'Cyberpunk',bg:'linear-gradient(135deg,#081225,#172747 55%,#101525)',accent:'#00d2ff',secondary:'#00ff9d'},
      {id:'sunset',name:'Sunset',bg:'linear-gradient(135deg,#2d0b15,#421b28)',accent:'#ffab40',secondary:'#ff4081'},
      {id:'forest',name:'Forest',bg:'linear-gradient(135deg,#051a12,#0d3326)',accent:'#00ff9d',secondary:'#aeff00'},
      {id:'ocean',name:'Deep Ocean',bg:'linear-gradient(135deg,#001e3c,#003366)',accent:'#00b4d8',secondary:'#90e0ef'},
      {id:'obsidian',name:'Obsidian',bg:'linear-gradient(135deg,#000,#1a1a1a)',accent:'#fff',secondary:'#aaa'},
      {id:'royal',name:'Royal',bg:'linear-gradient(135deg,#1a0b2e,#2d1b4e)',accent:'#ffd700',secondary:'#d4af37'},
      {id:'matrix',name:'Matrix',bg:'linear-gradient(135deg,#000,#0a140a)',accent:'#00ff00',secondary:'#008f11'},
      {id:'lavender',name:'Lavender',bg:'linear-gradient(135deg,#1e1e2e,#2a2a40)',accent:'#cba6f7',secondary:'#f5c2e7'},
      {id:'coffee',name:'Espresso',bg:'linear-gradient(135deg,#2b1b17,#3e2723)',accent:'#d7ccc8',secondary:'#a1887f'},
      {id:'crimson',name:'Crimson',bg:'linear-gradient(135deg,#2b0505,#4a0404)',accent:'#ff5252',secondary:'#ff8a80'}
    ];
    const defaultMarkdown = `# MD 簡報產生器\n### 用 Markdown 快速製作精美簡報\n\n---\n\n## 開始使用\n* 點擊右上角的編輯按鈕開啟編輯器\n* 使用 Markdown 撰寫內容，並以 \`---\` 分隔投影片\n* 選擇喜歡的主題後，按下「產生簡報」\n\n### 支援巢狀投影片\n使用 \`### 標題\` 建立同一章節中的子投影片。\n\n---\n\n## 匯出與分享\n完成後點擊下載按鈕，即可取得可獨立開啟的 HTML 簡報。\n\n### 鍵盤快捷鍵\n* 方向鍵或滑鼠滾輪：切換投影片\n* F：全螢幕\n* Esc：離開全螢幕或關閉編輯器`;
    let deck = null;
    let currentTheme = localStorage.getItem('mdppt-theme') || 'cyberpunk';
    let currentTransition = localStorage.getItem('mdppt-transition') || 'slide';
    let currentBackgroundImage = localStorage.getItem('mdppt-background-image') || '';

    window.addEventListener('DOMContentLoaded', () => { renderThemeSelector(); setTheme(currentTheme); const backgroundInput=document.getElementById('background-url'); backgroundInput.value=currentBackgroundImage; if(!setBackgroundImage(currentBackgroundImage)){ currentBackgroundImage=''; backgroundInput.value=''; localStorage.removeItem('mdppt-background-image'); } backgroundInput.addEventListener('input', event => { const value=event.target.value.trim(); const valid=setBackgroundImage(value); event.target.setCustomValidity(valid?'':'請輸入有效的圖片網址'); }); document.getElementById('transition-select').value = currentTransition; document.getElementById('transition-select').addEventListener('change', event => { currentTransition = event.target.value; localStorage.setItem('mdppt-transition', currentTransition); }); document.getElementById('md-input').value = defaultMarkdown; generateSlides(); });
    function renderThemeSelector() { document.getElementById('theme-container').innerHTML = themes.map(t => `<button type="button" class="theme-option" data-theme="${t.id}" aria-label="${t.name}" title="${t.name}" onclick="setTheme('${t.id}')" style="background:${t.bg}"></button>`).join(''); }
    function setTheme(id) { const t = themes.find(theme => theme.id === id) || themes[0]; currentTheme=t.id; document.documentElement.style.setProperty('--bg',t.bg); document.documentElement.style.setProperty('--accent',t.accent); document.documentElement.style.setProperty('--secondary',t.secondary); localStorage.setItem('mdppt-theme',t.id); document.querySelectorAll('.theme-option').forEach(el=>el.classList.toggle('active',el.dataset.theme===t.id)); if(deck) deck.sync(); }
    function setBackgroundImage(value) { const input=String(value||'').trim(); const reveal=document.querySelector('.reveal'); if(!input){ currentBackgroundImage=''; localStorage.removeItem('mdppt-background-image'); reveal?.style.removeProperty('background-image'); reveal?.style.removeProperty('background-size'); reveal?.style.removeProperty('background-position'); reveal?.style.removeProperty('background-repeat'); return true; } let url; try { url=new URL(input,document.baseURI); } catch { return false; } if(!['http:','https:','data:'].includes(url.protocol)) return false; currentBackgroundImage=input; localStorage.setItem('mdppt-background-image',input); if(reveal){ reveal.style.backgroundImage=`url(${JSON.stringify(input)})`; reveal.style.backgroundSize='cover'; reveal.style.backgroundPosition='center'; reveal.style.backgroundRepeat='no-repeat'; } return true; }
    function toggleModal(force) { const modal=document.getElementById('editor-modal'); const open=typeof force==='boolean'?force:modal.hidden; modal.hidden=!open; if(open) document.getElementById('md-input').focus(); }
    function toggleFullScreen() { if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
    function toggleHelp() { const help=document.getElementById('help-toast'); help.classList.toggle('show'); if(help.classList.contains('show')) setTimeout(()=>help.classList.remove('show'),5000); }
    function downloadHTML() { const md=document.getElementById('md-input').value; const exportedDocument=document.documentElement.cloneNode(true); exportedDocument.querySelector('#toolbar').innerHTML='<button class="tool-btn" type="button" onclick="toggleFullScreen()" aria-label="全螢幕"><i class="fa-solid fa-expand"></i></button>'; let html='<!doctype html>\n'+exportedDocument.outerHTML; html=html.replace(/const defaultMarkdown = [\s\S]*?;/,`const defaultMarkdown = ${JSON.stringify(md)};`); html=html.replace(/let currentTheme = [\s\S]*?;/,`let currentTheme = ${JSON.stringify(currentTheme)};`); html=html.replace(/let currentTransition = [\s\S]*?;/,`let currentTransition = ${JSON.stringify(currentTransition)};`); html=html.replace(/let currentBackgroundImage = [\s\S]*?;/,`let currentBackgroundImage = ${JSON.stringify(currentBackgroundImage)};`); const url=URL.createObjectURL(new Blob([html],{type:'text/html'})); const link=document.createElement('a'); link.href=url; link.download='mdppt.html'; link.click(); setTimeout(()=>URL.revokeObjectURL(url),0); }
    function handleFileUpload(input) { const file=input.files?.[0]; if(!file) return; const reader=new FileReader(); reader.onload=event=>document.getElementById('md-input').value=event.target.result; reader.readAsText(file); input.value=''; }
    function loadDefaultMarkdown() { document.getElementById('md-input').value=defaultMarkdown; }
    function createMeasureContext() { const isMobile=window.matchMedia('(max-width:700px)').matches; const width=isMobile?Math.max(window.innerWidth,320):960; const height=isMobile?Math.max(window.innerHeight,480):540; const margin=height*.06; const stage=document.createElement('div'); stage.className='reveal smart-measure-stage'; stage.setAttribute('aria-hidden','true'); stage.style.cssText=`position:absolute;left:-100000px;top:0;width:${width}px;height:${height}px;visibility:hidden;pointer-events:none;overflow:visible;`; const host=document.createElement('div'); host.className='smart-measure-host'; host.style.cssText=`position:absolute;left:0;top:${margin}px;width:${width}px;height:${height-margin*2}px;overflow:visible;`; stage.appendChild(host); document.body.appendChild(stage); return {stage,host,availableHeight:host.clientHeight}; }
    function prepareMeasureSection(section) { section.style.position='relative'; section.style.display='block'; section.style.width='100%'; section.style.height='auto'; section.style.minHeight='0'; section.style.margin='0'; section.style.transform='none'; section.style.visibility='visible'; }
    function isHeadingElement(element) { return /^H[1-6]$/.test(element.tagName); }
    function isBodyElement(element) { return !isHeadingElement(element) && !element.classList.contains('continuation-label'); }
    function addContinuationTitle(source,next) { const title=[...source.children].find(isHeadingElement); if(title){ const copy=title.cloneNode(true); copy.removeAttribute('id'); copy.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id')); if(!copy.querySelector(':scope > .continuation-marker')){ const marker=document.createElement('span'); marker.className='continuation-marker'; marker.textContent='（續）'; copy.appendChild(marker); } next.appendChild(copy); } else { const label=document.createElement('p'); label.className='continuation-label'; label.textContent='（續）'; next.appendChild(label); } }
    function createContinuationSection(source) { const next=document.createElement('section'); next.className='leaf-slide continuation'; addContinuationTitle(source,next); prepareMeasureSection(next); return next; }
    function insertContinuationContent(section,node) { if(node.matches('ul,ol')){ const existing=[...section.children].find(el=>isBodyElement(el)&&el.tagName===node.tagName); if(existing){ while(node.lastElementChild) existing.insertBefore(node.lastElementChild,existing.firstChild); node.remove(); return; } } const anchor=[...section.children].find(isBodyElement); section.insertBefore(node,anchor||null); }
    function moveLastSplittableContent(source,destination) { const blocks=[...source.children].filter(isBodyElement); for(let index=blocks.length-1;index>=0;index--){ const block=blocks[index]; if(block.matches('ul,ol')){ const items=[...block.children].filter(el=>el.tagName==='LI'); if(items.length>1){ const item=items[items.length-1]; item.remove(); let list=[...destination.children].find(el=>isBodyElement(el)&&el.tagName===block.tagName); if(!list){ list=block.cloneNode(false); insertContinuationContent(destination,list); } list.insertBefore(item,list.firstChild); return true; } block.remove(); insertContinuationContent(destination,block); return true; } if(block.matches('p,blockquote,pre,table,figure')){ block.remove(); insertContinuationContent(destination,block); return true; } } return false; }
    function splitSectionToFit(section,measure) { const parts=[section]; let current=section; while(current.scrollHeight>measure.availableHeight+1){ const next=createContinuationSection(current); measure.host.appendChild(next); while(current.scrollHeight>measure.availableHeight+1){ if(!moveLastSplittableContent(current,next)) break; } if(current.scrollHeight>measure.availableHeight+1){ next.remove(); current.dataset.smartOverflow='true'; current.classList.add('compact','dense','content-overflow'); break; } parts.push(next); current=next; } return parts; }
    function renderTokenGroup(tokens,measure) { const section=document.createElement('section'); section.className='leaf-slide'; section.innerHTML=marked.parser(tokens); prepareMeasureSection(section); measure.host.appendChild(section); return splitSectionToFit(section,measure); }
    function clearMeasureStyles(section) { ['position','display','width','height','min-height','margin','transform','visibility'].forEach(property=>section.style.removeProperty(property)); }
    function fitSlideContent() { document.querySelectorAll('#slides-container > section, #slides-container > section > section').forEach(slide=>{ if(slide.dataset.smartOverflow==='true') slide.classList.add('content-overflow'); }); deck?.layout(); }
    function generateSlides() { const source=document.getElementById('md-input').value.trim() || defaultMarkdown; const tokens=marked.lexer(source); const slides=[]; let slide=[]; tokens.forEach(token=>{ if(token.type==='hr'){ if(slide.length) slides.push(slide); slide=[]; } else slide.push(token); }); if(slide.length) slides.push(slide); if(deck){ deck.destroy(); deck=null; } const measure=createMeasureContext(); const output=[]; slides.forEach(group=>{ const hasSub=group.some(token=>token.type==='heading'&&token.depth===3); if(!hasSub){ output.push(...renderTokenGroup(group,measure)); return; } const outer=document.createElement('section'); const subs=[]; let sub=[]; group.forEach(token=>{ if(token.type==='heading'&&token.depth===3&&sub.length){ subs.push(sub); sub=[token]; } else sub.push(token); }); if(sub.length) subs.push(sub); subs.forEach(items=>renderTokenGroup(items,measure).forEach(section=>outer.appendChild(section))); output.push(outer); }); const container=document.getElementById('slides-container'); output.forEach(section=>section.querySelectorAll('section').forEach(clearMeasureStyles)); output.forEach(clearMeasureStyles); container.replaceChildren(...output); measure.stage.remove(); const isMobile=window.matchMedia('(max-width:700px)').matches; deck=new Reveal(document.querySelector('.reveal'),{controls:true,progress:true,center:true,hash:false,mouseWheel:true,transition:currentTransition||'slide',transitionSpeed:'slow',backgroundTransition:'fade',width:isMobile?window.innerWidth:960,height:isMobile?window.innerHeight:540,margin:.06,minScale:.2,maxScale:2}); deck.initialize().then(()=>requestAnimationFrame(fitSlideContent)); toggleModal(false); }
    document.addEventListener('keydown',event=>{ if(event.key==='Escape'&& !document.getElementById('editor-modal').hidden) toggleModal(false); if(event.key.toLowerCase()==='f'&&!event.target.matches('textarea,input')) toggleFullScreen(); });
    document.getElementById('editor-modal').addEventListener('click',event=>{ if(event.target.id==='editor-modal') toggleModal(false); });
  </script>
